[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kriya"
version = "0.1.0"
description = "Kriya AI Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "jinja2>=3.0.0",
    "mcp>=2.0.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "prompt_toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pip-tools>=7.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
kriya = "kriya.cli:main"
kriya-mcp = "kriya.mcp.server:main"

[tool.setuptools.packages.find]
include = ["kriya*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
markers = [
    "live_model: requires a real local LLM/embedding endpoint - excluded by default (see tests/test_live_smoke.py), run explicitly with `pytest -m live_model`",
]
# Excluded by default so a bare `pytest` never unexpectedly hangs/fails for
# lacking a local Ollama instance - CI's live-model job opts back in with
# `pytest -m live_model`, and so can a developer who has Ollama running.
addopts = "-m \"not live_model\""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports, etc.)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501",  # line length is handled by the formatter/reviewer, not a hard gate yet
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # asserting "some error occurs" is a valid test pattern, not a bug
"kriya/agents/agent.py" = ["B024"]  # BaseAgent is a deliberate no-abstract-methods base
"kriya/plugins/plugin.py" = ["B027"]  # empty initialize()/shutdown() are optional override hooks

