[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kriya"
version = "0.1.0"
description = "Kriya AI Engineering Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "openai>=1.0.0",
    "jinja2>=3.0.0",
    "mcp>=2.0.0",
    "httpx>=0.24.0",
    "numpy>=1.24.0",
    "prompt_toolkit>=3.0.0",
    # stdlib tomllib is 3.11+; kriya/core/tomlcompat.py uses this backport on 3.10.
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "pip-tools>=7.0.0",
    "ruff>=0.6.0",
    # 3.2 introduced possibly-used-before-assignment (E0606), the rule the
    # static-check gate exists for (see [tool.pylint] below).
    "pylint>=3.2",
]

[project.scripts]
kriya = "kriya.cli:main"
kriya-mcp = "kriya.mcp.server:main"

[tool.setuptools.packages.find]
# "skills" is a data-only namespace package: the bundled skill library lands
# at site-packages/skills, which is exactly where the installed Kriya looks
# for its shared global skills (kriya/skills/skill.py::get_global_skills_dir).
include = ["kriya*", "plugins.core_tools*", "skills"]

[tool.setuptools.package-data]
"kriya.config" = ["default_config.yaml"]
# Explicit shapes, never "*/*": a runtime-generated skill (auto-<repo>/,
# staged_rules.txt, .skill_conflicts.json) or OS clutter in a working tree
# must not ship. kriya.distribution --source-root additionally fails a
# release whose skills/ differs from the git-tracked set in either direction.
"skills" = [
    "*/skill.yaml",
    "*/instructions.md",
    "*/rules.txt",
    "*/rule_provenance.json",
    "*/examples/*",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Without this, a bare `pytest` from the repo root recursively discovers
# test_*.py ANYWHERE under the tree - including spikes/eval_harness/runs/,
# which fills up with real generated code (test_store.py, etc.) every time
# someone runs the eval harness locally. That directory is gitignored (never
# reaches CI), but not excluded from pytest's own filesystem walk, so a local
# `pytest` after any eval-harness batch tries to collect and import whatever
# a live model happened to generate - confirmed live, 2026-08-07: a landed
# python_task_tracker workspace's own test_store.py failed collection with
# ModuleNotFoundError (it imports relative to ITS OWN project layout, not
# Kriya's), aborting the whole run with "Interrupted: 1 error during
# collection" before any real Kriya test even got a chance to run. Scoping
# collection to tests/ (where Kriya's own suite actually lives, per this
# repo's CLAUDE.md) fixes this at the root instead of chasing every future
# spike/harness output directory with its own ignore rule.
testpaths = ["tests"]
markers = [
    "live_model: requires a real local LLM/embedding endpoint - excluded by default (see tests/test_live_smoke.py), run explicitly with `pytest -m live_model`",
    "chaos: PRD-032 chaos scenario (tests/_chaos_harness.py::SCENARIOS id as the marker argument) - deterministic cases run by default; `pytest -m chaos --chaos-report DIR` writes the chaos report",
    "live_target: a live_model test that needs the qualified TARGET production identity (the operator's machine: KRIYA_LIVE_LLM_MODEL, default qwen3-coder:30b); CI wiring smoke runs `-m \"live_model and not live_target\"`",
    "live_certification: PRD-035 live local-model certification matrix (tests/test_live_prd035_certification.py via scripts/certify_model.sh); also live_model + live_target, never CI",
    "certification_case: PRD-035 case identity (case id, task class) of a live_certification test",
    "state_machine: fast deterministic state-machine tier (retry/recovery/fallback, resume, verification/commit, budgets); run with `pytest -m state_machine` - never carries a live marker (tests/state_machine/test_sm_tier_guard.py)",
    "developer_answers_verbatim: FILE-INTEGRITY-CONTRACT-001 - the scripted per-file Developer answers reach the parser exactly as written (no translation into the protocol the prompt asks for; see tests/conftest.py::_scripted_developer_answers_speak_the_requested_protocol)",
    "live_static_analysis: requires the exact pinned static-analysis scanner (Semgrep 1.178.0; Docker + the pinned image for OCI cases) - excluded by default, run explicitly with `pytest -m live_static_analysis`",
]
# Excluded by default so a bare `pytest` never unexpectedly hangs/fails for
# lacking a local Ollama instance - CI's live-model job opts back in with
# `pytest -m live_model`, and so can a developer who has Ollama running.
addopts = "-m \"not live_model and not live_static_analysis\""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined names, unused imports, etc.)
    "I",    # isort (import ordering)
    "B",    # flake8-bugbear (common bug patterns)
]
ignore = [
    "E501",  # line length is handled by the formatter/reviewer, not a hard gate yet
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # asserting "some error occurs" is a valid test pattern, not a bug
"kriya/agents/agent.py" = ["B024"]  # BaseAgent is a deliberate no-abstract-methods base
"kriya/plugins/plugin.py" = ["B027"]  # empty initialize()/shutdown() are optional override hooks


# Static-check gate (CLAUDE.md "Mandatory quality bar" rule 1). Deliberately
# narrow and high-signal: a variable used on a path where it was never
# assigned (E0601/E0606, W0631 for a loop variable) and an undefined name
# (E0602). The Batch 5 enforce defect - `requirement_closure_attempts`
# bound only inside the terminal requirements block, so an early-stop run
# silently lost `requirements` from its result - is E0606 at 0c19967. The tree is at zero findings, so every
# new finding fails; there is no baseline file. E0611/E0603 are left off:
# kriya/workflow/__init__.py's lazy PEP 562 WorkflowEngine export is a false
# positive for both. Run: .venv/bin/pylint kriya plugins/core_tools tests
[tool.pylint.main]
jobs = 0

[tool.pylint."messages control"]
disable = ["all"]
enable = [
    "used-before-assignment",           # E0601
    "possibly-used-before-assignment",  # E0606
    "undefined-variable",               # E0602
    "undefined-loop-variable",          # W0631: a loop variable used after a loop that may not run
]

[tool.pylint.reports]
score = false
