# Scenario 02, steps 7-10: the OFFLINE run (desktop app). Placeholders: /Users/sriramnanduri/kriya-demo-v2-work/scenario-02/c2-skill. Real local model; public lookup OFF and no search endpoint. Same skills directory as the acquisition.
workflow_controller:
  enabled: true
  mode: enforce

autonomy:
  mode: "human-in-the-loop"
  web_lookup_enabled: false
  web_lookup_auto_approve: false
  run_verification_enabled: true
  self_correction_loop_enabled: false
  generation_time_budget_seconds: 900

search:
  base_url: ""

skills:
  load_global: false
  load_cwd: false

paths:
  skills: "/Users/sriramnanduri/kriya-demo-v2-work/scenario-02/c2-skill/skills"
  state: "/Users/sriramnanduri/kriya-demo-v2-work/scenario-02/c2-skill/state"
  memory: "/Users/sriramnanduri/kriya-demo-v2-work/scenario-02/c2-skill/memory"

llm:
  provider: "openai"
  model: "qwen3-coder:30b"
  api_key: "local-key"
  base_url: "http://127.0.0.1:18766/v1"
  temperature: 0.7
  reviewer_temperature: 0.7
  max_tokens: 16384
  capabilities:
    native_tool_calls: true
    json_mode: true
    reliable_multiline_json: false
    streaming: true
    max_tool_argument_chars: 8192
    preferred_edit_protocol: "small_native_tools"
  extra_body:
    options:
      num_ctx: 32768
      top_p: 0.8
      top_k: 20

llm_chain:
  - model: "qwen3.6:35b-a3b-q4_K_M"
    base_url: "http://127.0.0.1:18766/v1"
    api_key: "local-key"
    reasoning: false
    context_window: 32768
    temperature: 0.2

embedding:
  model: "nomic-embed-text:latest"
  base_url: "http://127.0.0.1:18766/v1"
