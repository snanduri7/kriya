# Machine-readable index of Demo V2. Checked against the files on disk by tests/test_demo_v2_assets.py.
schema_version: 1
product_baseline:
  tag: kriya-v1.2.0-pre-modularization
  commit: 1064b9e9f5cdee215b82ebdef7c4a177e37dce8a
  product_code_commit: 9de5404
solver_readiness_statement: "BACKEND SOLVER READINESS: FAIL. SOLVER REPEATABILITY: NOT ESTABLISHED. Demo V2 does not qualify the solver."
work_area:
  env: DEMO_V2_WORK
  default: ~/kriya-demo-v2-work
  note: "Clones, build output, state, memory and evidence are materialised here, never inside the repository."
scenarios:
  - id: 01-normal-coding
    title: Normal GUI coding flow (brownfield bug fix)
    dir: scenarios/01-normal-coding
    status: REHEARSED_ONCE_PASS
    model: live_local
    network: none
    fixtures: [brownfield-spring]
    expected: expected/scenario-01.md
    controlled: false
  - id: 02-knowledge-skill
    title: Terminal acquisition, GUI skill view, offline task run (terminal)
    dir: scenarios/02-knowledge-skill
    status: REHEARSED_ONCE_PASS_WITH_CAVEATS
    model: live_local
    network: acquisition_step_only
    fixtures: [knowledge-skill]
    expected: null
    controlled: false
  - id: 03-controlled-repair
    title: Controlled repair of a wrong model candidate
    dir: scenarios/03-controlled-repair
    status: REHEARSED_PASS_REPRODUCIBLE_CONTROLLED
    model: scripted_stub
    network: none
    fixtures: [controlled-repair]
    expected: null
    controlled: true   # CONTROLLED / SCRIPTED: must be labelled as such wherever it is shown
fixtures:
  - id: brownfield-spring
    dir: fixtures/brownfield-spring
    identity_file: fixtures/brownfield-spring/fixture.env
    in_git: false      # third-party snapshot, license unverified: materialised at prep time and checked against the identity file
  - id: controlled-repair
    dir: fixtures/controlled-repair
    identity_file: fixtures/controlled-repair/fixture.env
    in_git: true       # self-authored for Demo V2
  - id: knowledge-skill
    dir: fixtures/knowledge-skill
    identity_file: fixtures/knowledge-skill/fixture.env
    in_git: true       # self-authored; candidate 2 (UTF-16 function offsets); UNVALIDATED (scenario 02 is stopped)
  - id: knowledge-skill-c1-rejected
    dir: fixtures/knowledge-skill-c1-rejected
    identity_file: fixtures/knowledge-skill-c1-rejected/fixture.env
    in_git: true       # candidate 1, REJECTED: its no-skill baseline passed completely; kept as evidence
scripts:
  prepare: scripts/prepare_demo.sh
  reset: scripts/reset_demo.sh
  verify: scripts/verify_demo.sh
  stub_ctl: scripts/stub_ctl.sh   # start/stop the scenario 03 scripted stub
  scenario02_run: scripts/scenario02_run.sh   # scenario 02: ONE terminal run of the isolated task (noskill | skill | acquire), real local model behind a recording proxy
  launch_gui: scripts/launch_gui.sh   # the owner launcher: the PRODUCT desktop app for one scenario, with its own state directory
  capture_skills_page: scripts/capture_skills_page.sh   # scenario 02: screenshots of the populated Skills page for a scenario02_run.sh run
  rehearse_gui: scripts/rehearse_gui.sh   # drives the evidence-packaged app: 01 LIVE (real model), 03 CONTROLLED (scripted stub)
