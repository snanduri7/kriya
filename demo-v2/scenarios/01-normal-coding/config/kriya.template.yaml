# Scenario 01 - Kriya configuration template. Rendered by scripts/prepare_demo.sh (placeholders: @WORK@).
# Adapted from the previous demo-03 `generate.yaml`; it validated against this product baseline's AppConfig
# when the adaptation was made (re-checked by scripts/verify_demo.sh --phase pre).
#
# NOT YET REHEARSED through the GUI on this baseline: how the desktop host picks this file up (host setting
# `configDirectory`, operator configuration layering) is recorded as an open precondition in SCENARIO.md.
#
# Deliberately NOT `runtime_profile: production`: that profile adds containment, brownfield-baseline and
# qualification requirements that are outside what this scenario demonstrates. This is a development-profile demo.
workflow_controller:
  enabled: true
  mode: enforce

autonomy:
  # The reviewer-approved change is decided by a human in the GUI (Approvals), never auto-approved.
  mode: "human-in-the-loop"
  web_lookup_enabled: false
  web_lookup_auto_approve: false
  run_verification_enabled: true
  self_correction_loop_enabled: false
  generation_time_budget_seconds: 900

search:
  base_url: ""

skills:
  load_global: false
  load_cwd: false

paths:
  skills: "@WORK@/skills-empty"
  state: "@WORK@/state"
  memory: "@WORK@/memory"

llm:
  provider: "openai"
  model: "qwen3-coder:30b"
  api_key: "local-key"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7
  reviewer_temperature: 0.7
  max_tokens: 16384
  capabilities:
    native_tool_calls: true
    json_mode: true
    reliable_multiline_json: false
    streaming: true
    max_tool_argument_chars: 8192
    preferred_edit_protocol: "small_native_tools"
  extra_body:
    options:
      num_ctx: 32768
      top_p: 0.8
      top_k: 20

llm_chain:
  - model: "qwen3.6:35b-a3b-q4_K_M"
    base_url: "http://localhost:11434/v1"
    api_key: "local-key"
    reasoning: false
    context_window: 32768
    temperature: 0.2

embedding:
  model: "nomic-embed-text:latest"
  base_url: "http://localhost:11434/v1"
