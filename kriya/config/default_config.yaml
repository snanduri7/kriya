# Kriya Default Configuration

llm:
  provider: "openai"
  model: "qwen3-coder:30b-a3b-q8_0"
  api_key: "local-key"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7          # Higher temperature prevents MoE repetition loops
  max_tokens: 16384
  extra_body:
    options:
      num_ctx: 32768        # Sets a 32K context window so the code doesn't truncate
      top_p: 0.8
      top_k: 20

plugins:
  directory: "./plugins"
  enabled: []

paths:
  skills: "./skills"
  memory: "./memory"
  logs: "./logs"

logging:
  level: "INFO"
  file: "./logs/kriya.log"

mcp: {}

llm_chain:
  - model: "deepseek-r1:32b"
    base_url: "http://localhost:11434/v1"
    reasoning: true
    context_window: 32768
    temperature: 0.2



embedding:
  model: "nomic-embed-text:latest"
  base_url: "http://localhost:11434/v1"

# Natural-language command routing inside `kriya repl` (type a request instead of
# an explicit command, e.g. "why is this test flaky" instead of `ask "..."`).
# On by default - explicit commands are unaffected either way, routing only
# activates when the typed line doesn't already start with a real command name.
# Set enabled: false to turn it off. embed_model is separate from embedding.model
# on purpose (see spikes/version_b_routing/README.md); requires `ollama pull
# embeddinggemma` (or whatever embed_model you set) in addition to whatever
# model embedding.model already uses - if it isn't pulled, routing fails loudly
# with the exact pull command needed and disables itself for the rest of the
# session rather than silently misbehaving.
routing:
  enabled: true
  embed_model: "embeddinggemma:latest"
  reject_threshold: 0.3
  ask_margin: 0.05

autonomy:
  mode: "human-in-the-loop"
  sensitive_paths:
    - ".*\\.env$"
    - ".*secrets.*"
    - "\\.github/workflows/.*"
    - "Jenkinsfile"
    - ".*credentials.*"
    - ".*password.*"
  risk_threshold_lines: 500
