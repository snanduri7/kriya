# Kriya Default Configuration

llm:
  provider: "openai"
  model: "qwen3-coder:30b"
  api_key: "local-key"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7          # Higher temperature prevents MoE repetition loops
  # ReviewerAgent's own temperature, independent of whatever `temperature` above (or
  # a caller's own config) is set to - protects against the same MoE repetition-loop
  # failure class, for the Reviewer call specifically. See LLMConfig.reviewer_temperature
  # (kriya/config/config.py) for the live incident that motivated this (2026-08-18,
  # eval harness batch b-10t: a Reviewer call at temperature=0.2 looped on the
  # identical review block 250 times before hitting the token ceiling).
  reviewer_temperature: 0.7
  max_tokens: 16384
  capabilities:
    native_tool_calls: true
    json_mode: true
    reliable_multiline_json: false
    streaming: true
    max_tool_argument_chars: 8192
    preferred_edit_protocol: "small_native_tools"
  extra_body:
    options:
      num_ctx: 32768        # Sets a 32K context window so the code doesn't truncate
      top_p: 0.8
      top_k: 20

plugins:
  directory: "./plugins"
  enabled: []

paths:
  skills: "./skills"
  memory: "./memory"
  logs: "./logs"

skills:
  load_global: true
  load_cwd: true

logging:
  level: "INFO"
  file: "./logs/kriya.log"

mcp: {}

llm_chain:
  # deepseek-r1:32b (the previous entry here) isn't pulled locally (confirmed via
  # `ollama list`, 2026-08-15) - this fallback slot was silently unreachable the
  # whole time it was configured. qwen3.6:35b-a3b-q4_K_M is already the fallback
  # this session's eval harness independently validated live in this exact role
  # (spikes/eval_harness/run_harness.py's own LIVE_FALLBACK_MODEL default).
  # reasoning: false is deliberate, not a placeholder - this session's own real
  # think:true/think:false A/B data for THIS model (spikes/model_speed_poc/,
  # docs/kriya_backlog_and_lessons.md 2026-08-15 entries) found reasoning 71-85x
  # slower with no correctness benefit on Developer-shaped prompts, and the
  # harder-prompt arm never even finished before exhausting its reasoning budget.
  - model: "qwen3.6:35b-a3b-q4_K_M"
    base_url: "http://localhost:11434/v1"
    reasoning: false
    context_window: 32768
    temperature: 0.2



embedding:
  model: "nomic-embed-text:latest"
  base_url: "http://localhost:11434/v1"

# Natural-language command routing inside `kriya repl` (type a request instead of
# an explicit command, e.g. "why is this test flaky" instead of `ask "..."`).
# On by default - explicit commands are unaffected either way, routing only
# activates when the typed line doesn't already start with a real command name.
# Set enabled: false to turn it off. embed_model is separate from embedding.model
# on purpose (see spikes/version_b_routing/README.md); requires `ollama pull
# embeddinggemma` (or whatever embed_model you set) in addition to whatever
# model embedding.model already uses - if it isn't pulled, routing fails loudly
# with the exact pull command needed and disables itself for the rest of the
# session rather than silently misbehaving.
routing:
  enabled: true
  embed_model: "embeddinggemma:latest"
  reject_threshold: 0.3
  ask_margin: 0.05

# MA1 of the control-plane implementation plan (kriya/workflow/triage.py) -
# classifies each generation request's kind/risk_class/execution_weight.
# enabled: true here so shadow classification actually runs and gets logged
# (the whole point of MA1 is collecting real data to evaluate before MA2
# lets it affect anything); shadow_mode: true means current Kriya's
# behavior - context, planning, approval, retries - is completely unchanged
# regardless of what gets classified. Do not set shadow_mode: false until
# MA2 ships and classifications have been evaluated against real Kriya
# goals (MA1.5).
engineering_triage:
  enabled: true
  shadow_mode: true

# MA2 of the control-plane implementation plan (kriya/workflow/process_profile.py) -
# whether a resolved ProcessProfile actually changes run_generation_workflow()'s
# behavior. Separate from engineering_triage above on purpose: shadow_mode controls
# whether triage's OWN output can affect anything; these flags control whether MA2's
# specific behavioral changes are live, one at a time, for safe incremental
# activation. All false here - not yet live-validated. Set enabled + enforce_approval
# true to test MA2.5 (process-profile-driven human approval) in isolation;
# enforce_context_depth for MA2.6a (Graph RAG retrieval breadth). Do NOT set
# enforce_verification_depth - MA2 ships verification depth as telemetry-only by
# explicit decision ("a triage misclassification cannot reduce regression-test
# coverage in MA2") and kriya/config/config.py rejects true here at config-load
# time rather than silently doing nothing.
process_profiles:
  enabled: false
  enforce_approval: false
  enforce_context_depth: false
  enforce_verification_depth: false

# MA4 of the control-plane implementation plan (kriya/policy/) - whether
# ExecutionPolicy's decisions actually influence Kriya's behavior. enabled:
# true here matches what's already true in practice (every MA4.3-4.14 real
# call site has been consulting ExecutionPolicy unconditionally all along;
# this section just gives that an off-switch for the first time, not a new
# default). mode: audit is this session's binding constraint given code
# form - kriya/config/config.py's ExecutionPolicyConfig validator rejects
# "enforce" outright at config-load time. Do not set mode to enforce; it
# will fail validation until a future, separate milestone explicitly lifts
# that restriction.
execution_policy:
  enabled: true
  mode: audit

# MA6/MA7.8 (kriya/workflow/workflow_controller.py) - whether
# WorkflowController runs at all for `kriya generate`, and in what mode.
# enabled: false by default - a project opts in explicitly. mode: shadow
# is observational only (never touches real files); mode: enforce (real
# as of MA7.8) makes WorkflowController own the real outcome, calling
# run_generation_workflow() once per subtask instead of once for the
# whole goal - see workflow_controller.py's own module docstring and
# _run_structured_enforce's docstring for exactly what that does and its
# still-open scope boundaries (TOOL-tagged subtasks are refused outright).
#
# TRIED AND REVERTED same day (2026-08-24): enabled=true/mode=shadow was
# briefly the default, reasoned as zero-risk since shadow never affects
# real output - but shadow still makes its own real Planner/Architect/
# SubtaskExecutor LLM calls through the real WorkflowEngine, independent
# of run_generation_workflow(). Several tests (e.g. tests/test_file_goal.py)
# mock only WorkflowEngine.run_generation_workflow, not Kernel/LLMClient -
# previously sufficient to guarantee zero real network calls; with this
# enabled by default, shadow's own calls silently reached a real, unmocked
# LLMClient and hung/failed against a live endpoint the test never expected
# to hit. See kriya/config/config.py::WorkflowControllerConfig's own
# docstring for the full account before trying this again - it needs a
# real test-suite audit first (every run_generation_workflow-only mock
# site), not a casual re-flip.
workflow_controller:
  enabled: false
  mode: shadow

# runtime_profile (2026-08-25, external review P2) - unset here on purpose
# (None, the default - changes nothing). A project that wants the "all of
# MA1-7's real, opt-in behavior at once" bundle instead of remembering
# which combination of engineering_triage.shadow_mode/process_profiles.
# enabled/workflow_controller.enabled+mode to hand-tune can set, in its
# OWN kriya.yaml:
#   runtime_profile: hardened
# which unconditionally overrides those four fields to their most-real
# settings (see kriya/config/config.py::AppConfig's own docstring for
# exactly what it does and does NOT touch - execution_policy.mode stays
# separately gated). Only "hardened" and unset (null) are valid values.
# runtime_profile: null

autonomy:
  mode: "human-in-the-loop"
  sensitive_paths:
    - ".*\\.env$"
    - ".*secrets.*"
    - "\\.github/workflows/.*"
    - "Jenkinsfile"
    - ".*credentials.*"
    - ".*password.*"
  risk_threshold_lines: 500
  # Leave null for ordinary unbounded CLI runs. A harness with an outer timeout
  # should set this to the same or a slightly smaller value so Kriya can reserve
  # validation time and stop before beginning a doomed multi-file model pass.
  generation_time_budget_seconds: null
  generation_gate_reserve_seconds: 120
  generation_seconds_per_file_estimate: 90
  # SpecComplianceAgent (kriya/agents/agent.py): checks whether the goal's
  # LITERALLY named requirements (an exact field/method/class name, exact
  # type, exact constant) actually appear in the generated code - closes a
  # real gap compile/test/run-verification structurally can't (syntactically
  # valid, semantically non-compliant code passes every other gate).
  # Defaults False at the pydantic-model level (kriya/config/config.py's own
  # comment there explains why - test-suite blast radius, not a trust
  # concern) but ON here for real usage: validated live, 2026-08-22, against
  # the actual incident that motivated building it (ignite_qpid_protocol
  # milestone 1 - a goal naming 5 exact fields, generated code with a
  # different, incompatible set, every other gate passed anyway) - correctly
  # caught all 4 missing fields when given the real goal and the real wrong
  # code. Set to false to opt out.
  spec_compliance_enabled: true
  # Auto-runs a one-time index_repository() pass (dependency_graph.db +
  # vector_index.db) before generation starts, only when this workspace has
  # never been indexed - see kriya/config/config.py's own comment for the
  # full rationale. False here (unlike spec_compliance_enabled above) - not
  # yet live-validated; flip to true once it has been.
  auto_index_missing_dependency_graph: false
