# Kriya Default Configuration

llm:
  provider: "openai"
  model: "qwen3-coder:30b"
  api_key: "local-key"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7          # Higher temperature prevents MoE repetition loops
  # ReviewerAgent's own temperature, independent of whatever `temperature` above (or
  # a caller's own config) is set to - protects against the same MoE repetition-loop
  # failure class, for the Reviewer call specifically. See LLMConfig.reviewer_temperature
  # (kriya/config/config.py) for the live incident that motivated this (2026-08-18,
  # eval harness batch b-10t: a Reviewer call at temperature=0.2 looped on the
  # identical review block 250 times before hitting the token ceiling).
  reviewer_temperature: 0.7
  max_tokens: 16384
  capabilities:
    native_tool_calls: true
    json_mode: true
    reliable_multiline_json: false
    streaming: true
    max_tool_argument_chars: 8192
    preferred_edit_protocol: "small_native_tools"
  extra_body:
    options:
      num_ctx: 32768        # Sets a 32K context window so the code doesn't truncate
      top_p: 0.8
      top_k: 20

plugins:
  directory: "./plugins"
  enabled: []

paths:
  skills: "./skills"
  memory: "./memory"
  logs: "./logs"

skills:
  load_global: true
  load_cwd: true

logging:
  level: "INFO"
  file: "./logs/kriya.log"

mcp: {}

llm_chain:
  # deepseek-r1:32b (the previous entry here) isn't pulled locally (confirmed via
  # `ollama list`, 2026-08-15) - this fallback slot was silently unreachable the
  # whole time it was configured. qwen3.6:35b-a3b-q4_K_M is already the fallback
  # this session's eval harness independently validated live in this exact role
  # (spikes/eval_harness/run_harness.py's own LIVE_FALLBACK_MODEL default).
  # reasoning: false is deliberate, not a placeholder - this session's own real
  # think:true/think:false A/B data for THIS model (spikes/model_speed_poc/,
  # docs/kriya_backlog_and_lessons.md 2026-08-15 entries) found reasoning 71-85x
  # slower with no correctness benefit on Developer-shaped prompts, and the
  # harder-prompt arm never even finished before exhausting its reasoning budget.
  - model: "qwen3.6:35b-a3b-q4_K_M"
    base_url: "http://localhost:11434/v1"
    reasoning: false
    context_window: 32768
    temperature: 0.2



embedding:
  model: "nomic-embed-text:latest"
  base_url: "http://localhost:11434/v1"

# Natural-language command routing inside `kriya repl` (type a request instead of
# an explicit command, e.g. "why is this test flaky" instead of `ask "..."`).
# On by default - explicit commands are unaffected either way, routing only
# activates when the typed line doesn't already start with a real command name.
# Set enabled: false to turn it off. embed_model is separate from embedding.model
# on purpose (see spikes/version_b_routing/README.md); requires `ollama pull
# embeddinggemma` (or whatever embed_model you set) in addition to whatever
# model embedding.model already uses - if it isn't pulled, routing fails loudly
# with the exact pull command needed and disables itself for the rest of the
# session rather than silently misbehaving.
routing:
  enabled: true
  embed_model: "embeddinggemma:latest"
  reject_threshold: 0.3
  ask_margin: 0.05

autonomy:
  mode: "human-in-the-loop"
  sensitive_paths:
    - ".*\\.env$"
    - ".*secrets.*"
    - "\\.github/workflows/.*"
    - "Jenkinsfile"
    - ".*credentials.*"
    - ".*password.*"
  risk_threshold_lines: 500
