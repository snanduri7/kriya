# Kriya Default Configuration

llm:
  provider: "openai"
  model: "qwen3-coder:30b"
  api_key: "local-key"
  base_url: "http://localhost:11434/v1"
  temperature: 0.7          # Higher temperature prevents MoE repetition loops
  max_tokens: 4096
  extra_body:
    options:
      num_ctx: 32768        # Sets a 32K context window so the code doesn't truncate
      top_p: 0.8
      top_k: 20

plugins:
  directory: "./plugins"
  enabled: []

paths:
  skills: "./skills"
  memory: "./memory"
  logs: "./logs"

logging:
  level: "INFO"
  file: "./logs/kriya.log"

mcp: {}

embedding:
  model: "nomic-embed-text:latest"
  base_url: "http://localhost:11434/v1"

autonomy:
  mode: "human-in-the-loop"
  sensitive_paths:
    - ".*\\.env$"
    - ".*secrets.*"
    - "\\.github/workflows/.*"
    - "Jenkinsfile"
    - ".*credentials.*"
    - ".*password.*"
  risk_threshold_lines: 500
