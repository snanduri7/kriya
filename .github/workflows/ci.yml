name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the demo-v2 baseline tag and the history that connects it to HEAD
        # demo-v2/scripts/verify_demo.sh requires tag kriya-v1.2.0-pre-modularization to exist AND to be an ancestor of HEAD (tests/test_demo_v2_owner_state.py and
        # tests/test_demo_v2_spring_ignite.py run it). actions/checkout is a depth-1 clone without tags (MEASURED, run 41758354007: 5 failures, "baseline tag ... not
        # present in this checkout"). Only this tag and the history connecting it are fetched - not every branch and tag; the test is not changed to avoid the tag.
        run: git fetch --no-tags --unshallow origin "+refs/tags/kriya-v1.2.0-pre-modularization:refs/tags/kriya-v1.2.0-pre-modularization"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Kriya (declared dependency ranges)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  platform-windows:
    # ARCH-PLATFORM-001 / PLAT-003: Kriya core imports on a real Windows host
    # and the platform architecture guard holds there. Windows RUNTIME is not
    # supported (PORTABILITY_ARCHITECTURE_DEFINED / RUNTIME_NOT_SUPPORTED);
    # this job proves only that no core module needs a POSIX-only import and
    # that missing Windows providers report typed UNAVAILABLE. Blocking since
    # its first green run (run 36406170586 at 960b5f9), which closed PLAT-003.
    name: Platform import and architecture guard (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kriya (declared dependency ranges; the lock file is POSIX-resolved, PLAT-036)
        run: pip install -e ".[dev]"

      - name: Import Kriya core natively
        run: python -c "import kriya.cli, kriya.workflow.workflow, kriya.control.recovery, kriya.tools.validate, kriya.mcp.mcp, kriya.production_doctor, plugins.core_tools; from kriya.platform.services import platform_services; print(platform_services().identity())"

      - name: Platform architecture guard and lock contract
        run: python -m pytest -q -p no:cacheprovider tests/test_platform_architecture_guard.py tests/test_platform_workspace_lock_contract.py

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip here - this version overlaps the test matrix's own
          # 3.12 job, and actions/setup-python's auto-generated cache key has
          # no per-job discriminator, so two jobs sharing a Python version
          # race to save the same key ("Failed to save: Unable to reserve
          # cache... another job may be creating this cache" - harmless, but
          # noisy). This job does one pip install; caching isn't worth the
          # collision. Only the 5-way test matrix actually benefits.

      # CI-RUFF-001: the exact ruff the lock file pins (requirements.txt is
      # the single source of the version). A floating `ruff>=0.6.0` would let
      # a new ruff release add rules to the selected groups and turn this
      # zero-finding gate red with no code change.
      - name: Install ruff (lock-file version)
        run: pip install "$(grep '^ruff==' requirements.txt)"

      - name: Run ruff (zero findings; any new finding fails)
        run: ruff check .

  static-check:
    # Its own job, not a step after ruff: a ruff failure must not hide it.
    # Narrow pylint gate (unbound/undefined names); rules in pyproject.toml's
    # [tool.pylint], rationale in CLAUDE.md's "Mandatory quality bar".
    name: Static check (pylint, unbound/undefined names)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # No cache: pip - see the lint job's comment.

      # pylint and astroid at the lock-file versions, for the same reason as
      # the ruff pin above. Kriya is installed so imports resolve.
      - name: Install Kriya and the lock-file pylint/astroid
        run: |
          pip install -e ".[dev]"
          pip install "$(grep '^pylint==' requirements.txt)" "$(grep '^astroid==' requirements.txt)"

      - name: Run pylint gate
        run: pylint kriya plugins/core_tools tests

  lock-file:
    name: Verify dependency lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the demo-v2 baseline tag and the history that connects it to HEAD
        # demo-v2/scripts/verify_demo.sh requires tag kriya-v1.2.0-pre-modularization to exist AND to be an ancestor of HEAD (tests/test_demo_v2_owner_state.py and
        # tests/test_demo_v2_spring_ignite.py run it). actions/checkout is a depth-1 clone without tags (MEASURED, run 41758354007: 5 failures, "baseline tag ... not
        # present in this checkout"). Only this tag and the history connecting it are fetched - not every branch and tag; the test is not changed to avoid the tag.
        run: git fetch --no-tags --unshallow origin "+refs/tags/kriya-v1.2.0-pre-modularization:refs/tags/kriya-v1.2.0-pre-modularization"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          # No cache: pip - see the lint job's comment; this overlaps the
          # test matrix's own 3.14 job.

      - name: Install from requirements.txt (pinned lock file)
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Verify installed versions satisfy pyproject.toml constraints
        run: pip check

      - name: Run test suite against pinned versions
        run: pytest -q

  release-integrity:
    name: Source distribution and clean wheel install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install existing locked build and test dependencies
        # setuptools (the sdist/wheel build backend) is pinned in the lock
        # itself (--allow-unsafe), never installed unpinned alongside it.
        run: pip install -r requirements.txt
      - name: Verify source, sdist, wheel and clean installed CLI
        run: |
          python -m kriya.distribution .
          bash scripts/verify_release.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-integrity-evidence
          path: |
            /tmp/kriya-release.*/dist/*
            /tmp/kriya-release.*/*.txt
            /tmp/kriya-release.*/*.jsonl
          retention-days: 7

  production-certification:
    # PRD-034: the canonical production certification (scripts/certify.sh,
    # the same procedure the target machine runs). Non-root runner user;
    # explicit JDK/Maven/Semgrep versions; Docker-dependent tests must
    # execute (an unexpected skip fails); the pinned static-analysis tier runs
    # (STATIC-ANALYSIS-CI-LIVE-JOB-001); junit, skip audits, exact tool
    # versions and the production doctor JSON are archived.
    name: Production certification
    runs-on: ubuntu-latest
    # 360 minutes: operational capacity, not a weakening of any test - and GitHub's hosted-job ceiling, so there is no headroom above it. Topology:
    # scripts/certify.sh runs the SHARDED plan by default (CERT_TOPOLOGY unset): ONE authoritative census of the canonical population (`pytest -o addopts=
    # -m "not live_model"`), a deterministic static partition into one EXCLUSIVE shard (every Docker / JVM / Maven / toolchain / Semgrep test and every
    # measured container user, because their leak checks list every kriya container on the daemon) and three ordinary shards (CERT_ORDINARY_SHARDS), each
    # its own pytest process with its own TMPDIR, basetemp, progress and junit. No shard declares PASS: the verdict comes from the merged junit after the merge
    # audit proves union == census, the shards disjoint, one result per node and the tiers equal. Measured locally on a 10-core Mac: 1h54m sharded wall (the
    # exclusive shard alone 1h50m), 4h58m for the serial reference (CERT_TOPOLOGY=serial). A cold 4-vCPU hosted runner also pulls every pinned image and seeds the
    # offline Maven repository first, so this is the FIRST hosted measurement: reduce only on measured hosted durations.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the demo-v2 baseline tag and the history that connects it to HEAD
        # demo-v2/scripts/verify_demo.sh requires tag kriya-v1.2.0-pre-modularization to exist AND to be an ancestor of HEAD (tests/test_demo_v2_owner_state.py and
        # tests/test_demo_v2_spring_ignite.py run it). actions/checkout is a depth-1 clone without tags (MEASURED, run 41758354007: 5 failures, "baseline tag ... not
        # present in this checkout"). Only this tag and the history connecting it are fetched - not every branch and tag; the test is not changed to avoid the tag.
        run: git fetch --no-tags --unshallow origin "+refs/tags/kriya-v1.2.0-pre-modularization:refs/tags/kriya-v1.2.0-pre-modularization"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip - see the lint job's comment.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned Maven
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.9.9/binaries/apache-maven-3.9.9-bin.tar.gz \
            | tar xz -C "$HOME"
          echo "$HOME/apache-maven-3.9.9/bin" >> "$GITHUB_PATH"
      - name: Refuse to certify as root
        run: test "$(id -u)" != "0"
      - name: Create the certification venv (lock-file versions)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install -e . --no-deps
      - name: Install the pinned scanner
        run: pipx install semgrep==1.178.0
      - name: Pull and verify every pinned image by digest
        # tests/certification/pinned_images.txt; certify.sh re-verifies and
        # fails (never skips) on a missing or re-pointed image.
        run: .venv/bin/python scripts/pinned_images.py --pull
      - name: Seed the offline Maven repository (Ignite 2.18.0, JUnit 5.8.2) from Maven Central
        # The Spring/Ignite post-check and mutant tests need these artifacts offline; a cold runner has no warm ~/.m2, and a mandatory test is never
        # made optional (nor allowlisted) because the runner starts cold.
        run: scripts/seed_offline_maven.sh
      - name: Provision the frozen certification Maven repository (bootstrap, not certification)
        # MAVEN-CENTRAL-CERTIFICATION-NONDETERMINISM-001: the canonical run must not depend on live Maven Central. This step reconstructs the exact frozen set from the
        # committed manifest (each file is kept only if its SHA-256 equals the manifest's) - the one place Central is contacted; certify.sh then verifies it is attested and
        # byte-exact, serves it, and every contained Maven acquisition goes through the product's registry-mirror seam. Same manifest and tool as the local run.
        run: .venv/bin/python scripts/certification_maven_repo.py fetch tests/certification/maven_repository.manifest.json "$HOME/.cache/kriya-cert-maven/repo"
      - name: Pre-build the product containment images (bootstrap, not certification)
        # The registry proxy and the per-toolchain acquisition images are built by the product with apt-get on first use. Building them here, from the digest-pinned base images,
        # keeps the canonical run free of live apt; certify.sh records their ids and fails if the run builds or rebuilds any image.
        run: .venv/bin/python scripts/provision_containment_images.py build
      - name: Provision the frozen Python wheelhouse (bootstrap, not certification)
        # The release stage certifies packaging, not PyPI: it installs the locked dependencies with --no-index --require-hashes from this wheelhouse, which `pip download
        # --require-hashes` builds from the committed hashed lock (a file is kept only if its SHA-256 is listed).
        run: .venv/bin/python scripts/certification_python_wheels.py provision tests/certification/requirements.release.hashes.txt "$HOME/.cache/kriya-cert-wheels"
      - name: Provision the pinned Spring XML benchmark (spring-framework-petclinic at 09351b3, bootstrap, not certification)
        # tests/test_code_intel_config.py::test_pinned_spring_framework_petclinic_xml_parses_completely reads ~/kriya-bench/spring-framework-petclinic at exactly this commit
        # (the one every LR-R1/B2C/B3 evidence document cites) and is a mandatory certification test: it must be provisioned, never allowlisted. Fetched by commit id, not by
        # branch; the checkout is verified against the id.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/kriya-bench"
          git init -q "$HOME/kriya-bench/spring-framework-petclinic"
          cd "$HOME/kriya-bench/spring-framework-petclinic"
          git remote add origin https://github.com/spring-petclinic/spring-framework-petclinic.git
          git fetch -q --depth 1 origin 09351b3ee0bd5aec2d480c0280e84700978f56d3
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = 09351b3ee0bd5aec2d480c0280e84700978f56d3
      - name: Certify
        # Doctor mode here is `packaged_defaults`: a hosted runner holds no owner-approved production configuration (SEC-009: certification never
        # approves anything itself), so the production doctor is recorded as it reports on packaged defaults. See scripts/certify.sh.
        #
        # Exit status 4 = HOSTED_PASS_PRIVATE_FIXTURE_REQUIRED: every hosted requirement passed and the only open item is a typed EXTERNAL_PRIVATE_FIXTURE_REQUIRED test (PRD-034 F9b)
        # whose fixture may not be hosted. That is the hosted half of the certification and this job reports it as such (a notice, a green step); it is NOT "CERTIFIED": the
        # final verdict is `scripts/certification_private_gate.py verify`, which needs the private evidence record bound to this exact revision. Every other non-zero status
        # (1 NOT_CERTIFIED, 3 INCOMPLETE_PLATFORM_EVIDENCE, ...) still fails the step.
        run: |
          rc=0
          scripts/certify.sh certification-out/ci || rc=$?
          if [ "$rc" = 4 ]; then
            echo "::notice title=HOSTED PASS - NOT CERTIFIED::EXTERNAL_PRIVATE_FIXTURE_REQUIRED is open (PRD-034 F9b). Final CERTIFIED needs scripts/certification_private_gate.py verify with the private evidence record for this revision."
            exit 0
          fi
          exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-certification
          path: certification-out/ci
          retention-days: 30

  live-model-smoke:
    name: Primary live model regression (blocking)
    # A manual dispatch is the PRD-034 hosted certification, which is non-live by contract (the live matrix is PRD-035): this job installs Ollama and pulls a
    # model, so it does not start on `workflow_dispatch`. Push, pull request and the nightly schedule are unchanged.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Every other job here runs entirely against mocks - zero live LLM calls.
    # This job is deliberately separate and blocking for the supported
    # primary model. It installs pinned Ollama and pulls a small model, so it
    # is slower and has more moving parts
    # (network, model pull, a real inference server) than the rest of CI. Its
    # job is catching integration/regression bugs in Kriya's own code (a
    # prompt/response contract change, a JSON-parsing edge case) that only a
    # real model response can trigger - not grading code-generation quality,
    # which a small CI-pulled model isn't representative of. See
    # tests/test_live_smoke.py for what's actually asserted.
    env:
      OLLAMA_VERSION: "0.11.4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No cache: pip - see the lint job's comment; this overlaps both
          # the test matrix's own 3.12 job and the lint job.

      - name: Install Kriya (declared dependency ranges)
        run: pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:11434/api/tags >/dev/null

      - name: Pull small live-test models
        run: |
          ollama pull qwen2.5-coder:1.5b
          ollama pull all-minilm

      # PRD-034: wiring smoke on the CI model only. Tests marked live_target
      # need the qualified target identity and run on the target machine.
      - name: Run live-model smoke tests
        env:
          KRIYA_LIVE_LLM_MODEL: qwen2.5-coder:1.5b
        run: pytest -q -m "live_model and not live_target"

  nightly-live-model-matrix:
    name: Nightly live model (${{ matrix.model }})
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model: ["qwen2.5-coder:1.5b", "qwen2.5-coder:3b", "llama3.2:3b"]
    env:
      OLLAMA_VERSION: "0.11.4"
      KRIYA_LIVE_LLM_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kriya
        run: pip install -e ".[dev]"
      - name: Install and start pinned Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull "${KRIYA_LIVE_LLM_MODEL}"
          ollama pull all-minilm
      - name: Run live-model regression
        run: pytest -q -m "live_model and not live_target"
