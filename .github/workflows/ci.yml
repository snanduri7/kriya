name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Kriya (declared dependency ranges)
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Kriya (declared dependency ranges)
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

  lock-file:
    name: Verify dependency lock file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Install from requirements.txt (pinned lock file)
        run: |
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Verify installed versions satisfy pyproject.toml constraints
        run: pip check

      - name: Run test suite against pinned versions
        run: pytest -q
